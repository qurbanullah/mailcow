# mailcow / email server kernel tuning
# Applied by deploy.sh to /etc/sysctl.d/99-mailcow.conf
# Values follow the mailcow docs tuning recommendations.

# Higher socket/queue limits for many concurrent SMTP/IMAP connections
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535

# Faster TCP recycling / shorter FIN timeout for outbound SMTP bursts
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Larger SYN backlog (protects against SYN flood and bursty inbound mail)
net.ipv4.tcp_max_syn_backlog = 65535

# Wide ephemeral port range for outbound deliveries (important when sending
# lots of mail: the classic "Cannot assign requested address" failure)
net.ipv4.ip_local_port_range = 10240 65535

# Keep inotify sane for Dovecot/Maildir watch loops
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# File/process limits for a busy mail server
fs.file-max = 2097152
